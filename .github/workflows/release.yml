name: Release
on:
  push:
    tags:
      - 'rpi5-*'

jobs:
  build_for_release:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: build_for_release
    permissions:
      contents: write
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts

      - name: Create release payload
        shell: bash
        run: |
          mkdir -p release-files
          while IFS= read -r -d '' dir; do
            name="$(basename "${dir}")"
            (
              cd "${dir}"
              zip -r "../../release-files/${name}.zip" .
            )
          done < <(find release-artifacts -mindepth 1 -maxdepth 1 -type d -name '*Release*' -print0)

          shopt -s nullglob
          archives=(release-files/*.zip)
          if [[ "${#archives[@]}" -eq 0 ]]; then
            echo "No release archive was produced" >&2
            exit 1
          fi

          {
            echo "## Source revisions"
            echo
            echo "| Repository | Commit |"
            echo "| --- | --- |"
            printf '| `rpi5-uefi` | `%s` |\n' "$(git rev-parse HEAD)"
            for module in arm-trusted-firmware edk2 edk2-non-osi edk2-platforms; do
              commit="$(git ls-tree HEAD "${module}" | awk '{print $3}')"
              printf '| `%s` | `%s` |\n' "${module}" "${commit}"
            done
          } > release-files/SOURCE_REVISIONS.md

          (
            cd release-files
            sha256sum ./*.zip > SHA256SUMS
          )

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: RPi5 UEFI ${{ github.ref_name }}
          body_path: release-files/SOURCE_REVISIONS.md
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: "release-files/*"
          fail_on_unmatched_files: true
