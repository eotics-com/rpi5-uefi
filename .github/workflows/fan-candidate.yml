name: Experimental fan candidate

on:
  push:
    branches:
      - fan-persistent-windows-driver
  pull_request:
    paths:
      - 'WindowsDriver/Rpi5Fan/**'
      - 'temporary-patches/edk2-platforms/**'
      - 'build.sh'
      - '.github/workflows/fan-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curve-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile and test the platform-independent curve
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            WindowsDriver/Rpi5Fan/tests/FanCurveTests.c \
            -o fan-curve-tests
          ./fan-curve-tests

  uefi:
    uses: ./.github/workflows/build.yml

  windows-driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Restore WDK NuGet package and build ARM64 driver
        shell: pwsh
        run: |
          $solution = 'WindowsDriver\Rpi5Fan\Rpi5Fan.sln'
          msbuild $solution `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:TargetPlatformVersion=10.0.26100.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msbuild $solution `
            /m `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:TargetPlatformVersion=10.0.26100.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Normalize signed driver package
        shell: pwsh
        run: |
          $releaseRoot = 'WindowsDriver\Rpi5Fan\bin\ARM64\Release'
          $driverDir = Join-Path $releaseRoot 'Rpi5Fan'
          $certificate = Join-Path $releaseRoot 'Rpi5Fan.cer'
          if (-not (Test-Path -LiteralPath $certificate)) {
            throw "WDK did not export the test certificate: $certificate"
          }
          Copy-Item -LiteralPath $certificate -Destination (Join-Path $driverDir 'Rpi5Fan.cer') -Force
          foreach ($name in 'Rpi5Fan.inf','Rpi5Fan.sys','rpi5fan.cat','Rpi5Fan.cer') {
            $path = Join-Path $driverDir $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Incomplete driver package: $path"
            }
          }

      - name: Validate driver INF and installer recovery logic
        shell: pwsh
        run: |
          $infPath = 'WindowsDriver\Rpi5Fan\bin\ARM64\Release\Rpi5Fan\Rpi5Fan.inf'
          $infverif = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windows.wdk.x64\10.0.26100.6584\c\tools\10.0.26100.0\x64\infverif.exe'
          & $infverif /w $infPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $infText = Get-Content -LiteralPath $infPath -Raw
          if ($infText -notmatch 'DriverVer\s*=\s*08/17/2026\s*,\s*2026\.8\.17\.3') {
            throw 'Generated INF DriverVer is not pinned to 08/17/2026,2026.8.17.3.'
          }
          if ($infText -notmatch 'NTARM64' -or $infText -notmatch 'ACPI\\RPI000F') {
            throw 'Generated INF does not match ARM64 ACPI\RPI000F.'
          }

          $installerSource = Get-Content 'WindowsDriver\Rpi5Fan\Install-RPi5Fan.ps1' -Raw
          if ($installerSource -notmatch "ExpectedDriverVersion = '2026\.8\.17\.3'") {
            throw 'Installer expected DriverVer is not synchronized with the generated INF.'
          }
          if ($installerSource -notmatch 'ExitCode -eq 259') {
            throw 'Installer does not contain explicit PnPUtil ERROR_NO_MORE_ITEMS handling.'
          }
          if ($installerSource -notmatch 'DEVPKEY_Device_DriverInfPath' -or $installerSource -notmatch 'DEVPKEY_Device_DriverVersion') {
            throw 'Installer does not inspect the selected INF/version before stale-package recovery.'
          }

      - name: Validate passive timer fix
        shell: pwsh
        run: |
          $source = Get-Content WindowsDriver\Rpi5Fan\Driver.c -Raw
          if ($source -match 'WDF_TIMER_CONFIG_INIT_PERIODIC') {
            throw 'Periodic KMDF timer configuration is not allowed for this passive-level timer.'
          }
          if ($source -notmatch 'WDF_TIMER_CONFIG_INIT\(&timerConfig,\s*FanEvtTimer\)') {
            throw 'Expected one-shot KMDF timer initialization was not found.'
          }
          if ($source -notmatch 'TimerEnabled') {
            throw 'Expected timer lifecycle guard was not found.'
          }

      - name: Build and decode-test one-shot installer
        shell: pwsh
        run: |
          $driverDir = 'WindowsDriver\Rpi5Fan\bin\ARM64\Release\Rpi5Fan'
          $releaseDir = 'fan-release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          & 'WindowsDriver\Rpi5Fan\tools\New-OneShotInstaller.ps1' `
            -DriverDir $driverDir `
            -InstallerScript 'WindowsDriver\Rpi5Fan\Install-RPi5Fan.ps1' `
            -OutputPath (Join-Path $releaseDir 'Install_RPi5Fan_OneShot.cmd')

          $installer = Get-Item (Join-Path $releaseDir 'Install_RPi5Fan_OneShot.cmd')
          if ($installer.Length -lt 10000) {
            throw 'Generated one-shot installer is unexpectedly small.'
          }

          $lines = [IO.File]::ReadAllLines($installer.FullName)
          $markers = @()
          for ($i = 0; $i -lt $lines.Length; ++$i) {
            if ($lines[$i].Trim() -eq '__RPI5FAN_PAYLOAD__') {
              $markers += $i
            }
          }
          if ($markers.Count -ne 1) {
            throw "Expected exactly one standalone payload marker; found $($markers.Count)."
          }
          $marker = $markers[0]
          if ($marker -ge ($lines.Length - 1)) {
            throw 'Payload marker has no data after it.'
          }
          $b64 = (($lines[($marker + 1)..($lines.Length - 1)]) -join '') -replace '\s',''
          if ([string]::IsNullOrWhiteSpace($b64)) {
            throw 'Embedded payload is empty.'
          }

          $decodedZip = Join-Path $env:RUNNER_TEMP 'rpi5fan-embedded-payload.zip'
          $decodedDir = Join-Path $env:RUNNER_TEMP 'rpi5fan-embedded-payload'
          [IO.File]::WriteAllBytes($decodedZip, [Convert]::FromBase64String($b64))
          Expand-Archive -LiteralPath $decodedZip -DestinationPath $decodedDir -Force

          foreach ($name in 'Rpi5Fan.inf','Rpi5Fan.sys','rpi5fan.cat','Rpi5Fan.cer','Install-RPi5Fan.ps1') {
            $path = Join-Path $decodedDir $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Decoded one-shot payload is missing: $name"
            }
          }

          $sourceSys = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $driverDir 'Rpi5Fan.sys')).Hash
          $embeddedSys = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $decodedDir 'Rpi5Fan.sys')).Hash
          if ($sourceSys -ne $embeddedSys) {
            throw 'Embedded Rpi5Fan.sys does not match the verified ARM64 build.'
          }
          Write-Host 'One-shot embedded payload decode test passed.'

          $packageDir = Join-Path $env:RUNNER_TEMP 'RPi5Fan_ARM64_v0.1.1'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          foreach ($name in 'Rpi5Fan.inf','Rpi5Fan.sys','rpi5fan.cat','Rpi5Fan.cer') {
            Copy-Item (Join-Path $driverDir $name) -Destination $packageDir
          }
          Copy-Item 'WindowsDriver\Rpi5Fan\Install-RPi5Fan.ps1' -Destination $packageDir
          Copy-Item 'WindowsDriver\Rpi5Fan\README.md' -Destination $packageDir
          Copy-Item 'THIRD_PARTY_NOTICES.md' -Destination $packageDir
          Copy-Item 'LICENSES\Soulveig-BSD-2-Clause-Patent.txt' -Destination $packageDir

          Compress-Archive `
            -Path (Join-Path $packageDir '*') `
            -DestinationPath (Join-Path $releaseDir 'RPi5Fan_ARM64_v0.1.1.zip') `
            -CompressionLevel Optimal

          $files = Get-ChildItem $releaseDir -File | Sort-Object Name
          $hashLines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $releaseDir 'SHA256SUMS.txt'), $hashLines)

          Get-ChildItem $releaseDir | Format-Table Name,Length
          Get-Content (Join-Path $releaseDir 'SHA256SUMS.txt')

      - name: Upload unsigned/test-signed candidate package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RPi5Fan_ARM64_experimental
          path: |
            WindowsDriver/Rpi5Fan/bin/ARM64/Release/Rpi5Fan/Rpi5Fan.sys
            WindowsDriver/Rpi5Fan/bin/ARM64/Release/Rpi5Fan/Rpi5Fan.inf
            WindowsDriver/Rpi5Fan/bin/ARM64/Release/Rpi5Fan/rpi5fan.cat
            WindowsDriver/Rpi5Fan/bin/ARM64/Release/Rpi5Fan/Rpi5Fan.cer
            WindowsDriver/Rpi5Fan/README.md
            THIRD_PARTY_NOTICES.md
            LICENSES/Soulveig-BSD-2-Clause-Patent.txt
          if-no-files-found: error

      - name: Upload one-shot release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RPi5Fan_release_v0.1.1
          path: fan-release/*
          if-no-files-found: error

  release-fan-driver:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-fan]') }}
    runs-on: ubuntu-latest
    needs:
      - curve-tests
      - windows-driver
    permissions:
      contents: write
    steps:
      - name: Download verified driver release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: RPi5Fan_release_v0.1.1
          path: release-files

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Raspberry Pi 5 Active Cooler Windows driver v0.1.1 - experimental 3

          Experimental ARM64 KMDF driver for the `ACPI\\RPI000F` fan device published by the companion RPi5 UEFI fan patch.

          ### Driver fix
          - Keeps the v0.1.1 passive-timer fix for the observed Code 31 / `STATUS_NOT_SUPPORTED (0xC00000BB)` failure.
          - Uses Windows `DriverVer=08/17/2026,2026.8.17.3` so this package outranks earlier experimental packages that were automatically timestamp-stamped by WDK with numerically higher versions than `0.1.1.0`.

          ### Installer fixes in exp.3
          - Handles PnPUtil return code `259` (`ERROR_NO_MORE_ITEMS`) instead of treating it as an immediate fatal error.
          - Reads the currently selected `DEVPKEY_Device_DriverInfPath`, `DEVPKEY_Device_DriverVersion`, and provider.
          - If Windows is still selecting a recognized older RPi5Fan `oem*.inf`, the installer removes only that stale package, rescans PnP, and retries the verified driver installation.
          - Verifies that Windows ultimately selected DriverVer `2026.8.17.3` before evaluating the final device state.
          - Keeps the exp.2 standalone embedded-payload format and CI decode/hash verification.
          - Keeps `Desktop\\RPi5Fan-install.log` plus automatic SetupAPI diagnostics on a final device error.

          ### Install
          Download **`Install_RPi5Fan_OneShot.cmd`** from this exp.3 release and run it. It requests Administrator privileges automatically.

          Windows test-signing is still required because this is a test-signed experimental driver. If the installer has to enable test-signing, reboot and run the same installer again.

          ### Safety
          This remains an experimental prerelease and still needs physical Raspberry Pi 5 validation. Keep the UEFI fan setting in a fail-safe configuration until the driver is confirmed healthy on the target board.
          EOF

      - name: Publish experimental fan driver release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: rpi5fan-v0.1.1-exp.3
          target_commitish: ${{ github.sha }}
          name: RPi5 Fan Driver v0.1.1 experimental 3
          body_path: release-notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
          make_latest: false
          files: release-files/*
          fail_on_unmatched_files: true
